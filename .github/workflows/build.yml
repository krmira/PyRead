
name: Build PyRead Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libsqlite3-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.36

      - name: Verify project configuration
        run: |
          test -f main.py
          test -f buildozer.spec
          grep -q '^\[app\]' buildozer.spec
          buildozer --version

      - name: Build Android APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PyRead-debug
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 7
