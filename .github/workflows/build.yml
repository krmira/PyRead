
      - name: Install Android NDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk
        run: |
          set -eux

          SDK="$ANDROID_SDK_ROOT"

          if [ ! -d "$SDK/cmdline-tools" ] && [ ! -d "$SDK/tools/bin" ]; then
            echo "Android SDK command-line tools are missing."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager
            exit 1
          fi

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Could not find executable sdkmanager."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" "ndk;25.2.9519653"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

          test -d "$SDK/ndk/25.2.9519653"
