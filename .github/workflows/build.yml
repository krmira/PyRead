
name: Build PyRead APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython==0.29.37

      - name: Configure Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_TOOLS="$SDK/cmdline-tools/latest"

          mkdir -p "$CMDLINE_TOOLS"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-commandlinetools.zip

          unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-cmdline

          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$CMDLINE_TOOLS"
          mv /tmp/android-cmdline/cmdline-tools "$CMDLINE_TOOLS"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | sdkmanager --sdk_root="$SDK" --licenses

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Checking Android SDK tools..."
          sdkmanager --sdk_root="$SDK" --list

          test -x "$SDK/build-tools/34.0.0/aidl"
          test -x "$SDK/platform-tools/adb"

      - name: Install Android NDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          sdkmanager --sdk_root="$SDK" \
            "ndk;25b"

          echo "ANDROID_NDK_HOME=$SDK/ndk/25b" >> "$GITHUB_ENV"
          echo "$SDK/ndk/25b" >> "$GITHUB_PATH"

      - name: Show build environment
        run: |
          python --version
          java -version
          buildozer --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"
          ls -la "$ANDROID_HOME/platforms"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PyRead-APK
          path: |
            bin/*.apk
          if-no-files-found: warn
          retention-days: 7
